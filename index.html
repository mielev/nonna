<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NONNA</title>
  <link rel="icon" type="image/svg+xml" href="assets/logos/NonnaTree_RedClay.svg">
  <link rel="stylesheet" href="styles.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #2f1916;
    }

    /* ── Slideshow ── */
    .slideshow {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .slide {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 1.4s ease-in-out;
    }

    .slide.active {
      opacity: 1;
    }

    /* ── Dark overlay ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.48);
      z-index: 1;
    }

    /* ── Logo — top center ── */
    .landing-logo {
      position: fixed;
      top: 0%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      width: clamp(160px, 22vw, 320px);
      filter: drop-shadow(0 2px 18px rgba(0,0,0,0.35));
    }

    /* ── bem-vinda — dead center ── */
    .landing-link {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      font-family: 'SangBleu Sunrise', 'IM Fell English', serif;
      font-weight: 400;
      font-size: clamp(0.75rem, 1.1vw, 0.95rem);
      letter-spacing: 0.28em;
      text-transform: lowercase;
      color: #e8ddcd;
      text-decoration: none;
      border-bottom: 1px solid rgba(232, 221, 205, 0.45);
      padding-bottom: 2px;
      white-space: nowrap;
      transition: color 0.3s, border-color 0.3s;
    }

    .landing-link:hover {
      color: #ffffff;
      border-color: rgba(255,255,255,0.7);
    }
  </style>
</head>
<body>

  <!-- Slideshow -->
  <div class="slideshow" id="slideshow">
    <div class="slide active" style="background-image: url('assets/images/Landing-Page-1.JPG')"></div>
    <div class="slide" style="background-image: url('assets/images/Landing-Page-2.JPG')"></div>
    <div class="slide" style="background-image: url('assets/images/Landing-Page-3.JPG')"></div>
    <div class="slide" style="background-image: url('assets/images/Landing-Page-5.JPG')"></div>
  </div>

  <!-- Dark overlay -->
  <div class="overlay"></div>

  <!-- Logo: top center -->
  <img src="assets/logos/FullLogo_Vanilla.svg" alt="Nonna" class="landing-logo">

  <!-- bem-vinda: dead center -->
  <a href="bem-vindos/" class="landing-link">bem-vindos</a>

  <script>
    (function () {
      const slides = document.querySelectorAll('.slide');
      let current = 0;
      setInterval(function () {
        slides[current].classList.remove('active');
        current = (current + 1) % slides.length;
        slides[current].classList.add('active');
      }, 3000);
    })();
  </script>
</body>
</html>
