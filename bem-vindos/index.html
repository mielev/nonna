<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NONNA</title>
  <link rel="icon" type="image/svg+xml" href="../assets/logos/NonnaTree_PinkRadicchio.svg">
  <link rel="stylesheet" href="../styles.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      background: #e8ddcd;
      color: #2f1916;
      font-family: 'Cardo', serif;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      text-transform: lowercase;
    }

    /* ── Header bar ── */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 2.2rem 3rem;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      z-index: 100;
      transition: color 0.4s ease;
    }

    /* left: bem-vinda */
    .back-link {
      font-family: 'Cardo', serif;
      font-size: clamp(0.7rem, 1.1vw, 0.88rem);
      letter-spacing: 0.22em;
      text-transform: lowercase;
      color: #2a1f21;
      text-decoration: none;
      border-bottom: 1px solid rgba(47, 25, 22, 0.35);
      padding-bottom: 2px;
      transition: color 0.4s ease, border-color 0.4s ease, opacity 0.3s;
      justify-self: start;
    }

    .back-link:hover { opacity: 0.6; }

    /* center: horizontal logo — fades in on scroll */
    .header-logo-wrap {
      justify-self: center;
      display: flex;
      align-items: center;
      position: relative;
    }

    .header-logo {
      width: clamp(80px, 10vw, 150px);
      display: block;
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    .header-logo.charcoal { display: block; }
    .header-logo.vanilla  { display: none; }

    /* right: em breve */
    .em-breve {
      font-family: 'Cardo', serif;
      font-size: clamp(0.7rem, 1.1vw, 0.88rem);
      letter-spacing: 0.22em;
      text-transform: lowercase;
      color: #2a1f21;
      opacity: 0.55;
      transition: color 0.6s ease, opacity 0.6s ease;
      justify-self: end;
    }

    /* scrolled: fade header logo in */
    header.scrolled .header-logo {
      opacity: 1;
    }

    /* light variant — over dark chocolate footer */
    header.light .back-link {
      color: #e8ddcd;
      border-bottom-color: rgba(232, 221, 205, 0.4);
    }
    header.light .em-breve { color: #e8ddcd; opacity: 0.7; }

    /* swap logo versions on dark bg */
    header.light .header-logo.charcoal { display: none; }
    header.light .header-logo.vanilla  { display: block; opacity: 1; }

    /* ── Hero: two-column ── */
    .hero {
      width: 100%;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    /* Left: logo + manifest */
    .hero-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8rem 2rem 6rem 3rem;
      gap: 2.5rem;
    }

    .hero-logo {
      width: clamp(141px, 17.6vw, 264px);
      transition: opacity 0.6s ease;
    }

    .manifest-top {
      text-align: center;
      font-size: clamp(1.1rem, 1.8vw, 1.45rem);
      line-height: 1.78;
      letter-spacing: 0.04em;
      color: #2a1f21;
      text-transform: lowercase;
      transition: opacity 0.6s ease;
    }

    /* Right: single image, reduced by 30% */
    .hero-image {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .hero-image img {
      width: 61%;
      object-fit: contain;
      object-position: center;
      padding: 0;
      margin-top: 3%;
      display: block;
      border: 2px solid rgba(255, 255, 255, 0.85);
    }

    .hero-image .img-wrap {
      width: 61%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 3%;
    }

    .hero-image .img-wrap img {
      width: 100%;
      margin-top: 0;
      padding: 0;
      display: block;
      border: 2px solid rgba(255, 255, 255, 0.85);
    }

    @media (max-width: 768px) {
      .hero {
        grid-template-columns: 1fr;
      }
      .hero-inner {
        align-items: center;
        text-align: center;
        padding: 8rem 2rem 3rem;
      }
      .manifest-top { text-align: center; }
      .hero-image { min-height: 60vw; }
      .hero-image img { padding: 2rem; }
    }

    /* ── Photo grid ── */
    .photo-section {
      padding: 4vh 0 0;
    }

    /* consistent gap throughout */
    .gap { --g: 5px; }

    /* Full-width */
    .photo-full {
      width: 100%;
      margin-bottom: var(--g, 5px);
    }

    .photo-full img {
      width: 100%;
      height: clamp(320px, 52vw, 660px);
      object-fit: cover;
      display: block;
    }

    /* Two-column */
    .photo-duo {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
      margin-bottom: 5px;
    }

    .photo-duo img {
      width: 100%;
      height: clamp(240px, 36vw, 480px);
      object-fit: cover;
      display: block;
    }

    /* Three-column */
    .photo-trio {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 5px;
      margin-bottom: 5px;
    }

    .photo-trio img {
      width: 100%;
      height: clamp(200px, 28vw, 400px);
      object-fit: cover;
      display: block;
    }

    /* Asymmetric 2/3 + 1/3 */
    .photo-asym {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 5px;
      margin-bottom: 5px;
    }

    .photo-asym img {
      width: 100%;
      height: clamp(240px, 36vw, 500px);
      object-fit: cover;
      display: block;
    }

    /* ── Closing section ── */
    .closing {
      position: relative;
      background: #3F2021;
      color: #e8ddcd;
      padding: clamp(4rem, 10vh, 9rem) clamp(1.5rem, 6vw, 5rem);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      min-height: clamp(240px, 42vh, 500px);
    }

    .closing-text {
      max-width: 640px;
      text-align: center;
      font-size: clamp(1rem, 1.9vw, 1.45rem);
      line-height: 1.8;
      letter-spacing: 0.04em;
      color: #f7f1e2;
      text-transform: lowercase;
    }

    /* Tree — small reference mark, bottom-left corner, independent of text layout */
    .closing-tree {
      position: absolute;
      left: 16px;
      bottom: 16px;
      width: clamp(36px, 3.8vw, 54px);
      opacity: 0.92;
    }

    /* ── Mobile ── */
    @media (max-width: 640px) {
      header {
        padding: 1.6rem 1.5rem;
      }

      .hero {
        min-height: 55vh;
        padding: 4vh 1.2rem 6vh;
      }

      .photo-duo,
      .photo-trio,
      .photo-asym {
        grid-template-columns: 1fr;
        gap: 4px;
        margin-bottom: 4px;
      }

      .photo-duo img,
      .photo-trio img,
      .photo-asym img,
      .photo-full img {
        height: 60vw;
      }

      .closing {
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 3.5rem 1.5rem;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <a href="/" class="back-link">bem-vindos</a>
    <!-- center logo: clips up into view on scroll, swaps on dark bg -->
    <div class="header-logo-wrap">
      <img src="../assets/logos/Horizontal_Charcoal.svg" alt="Nonna" class="header-logo charcoal">
      <img src="../assets/logos/Horizontal_Vanilla.svg"  alt="Nonna" class="header-logo vanilla">
    </div>
    <span class="em-breve">em breve</span>
  </header>

  <!-- Hero: two-column -->
  <section class="hero">

    <!-- Left: logo + manifest -->
    <div class="hero-inner">
      <img src="../assets/logos/Nonna_CenterAlign_Coffee.svg" alt="Nonna" class="hero-logo">
      <div class="manifest-top">
        <p>onde menos se torna mais</p>
        <p>e cada mordida te lembra</p>
        <p>que a natureza é extraordinária.</p>
      </div>
    </div>

    <!-- Right: tote bag image -->
    <div class="hero-image">
      <div class="img-wrap">
        <img src="../assets/images/Tote-bag.png" alt="">
      </div>
    </div>

  </section>

  <!-- Photo grid -->
  <section class="photo-section">

    <!-- Row 1: full width -->
    <div class="photo-full">
      <img src="../assets/images/Inner-Page---1.jpg" alt="">
    </div>

    <!-- Row 2: two columns -->
    <div class="photo-duo">
      <img src="../assets/images/Inner-Page---2.JPG" alt="">
      <img src="../assets/images/Inner-Page---3.JPG" alt="">
    </div>

    <!-- Row 3: full width -->
    <div class="photo-full">
      <img src="../assets/images/Inner-Page---4.JPG" alt="">
    </div>

    <!-- Row 4: three columns -->
    <div class="photo-trio">
      <img src="../assets/images/Inner-Page---5.JPG" alt="">
      <img src="../assets/images/Inner-Page---6.JPG" alt="">
      <img src="../assets/images/Inner-Page---7.JPG" alt="">
    </div>

    <!-- Row 5: asymmetric -->
    <div class="photo-asym">
      <img src="../assets/images/Inner-Page---8.JPG" alt="">
      <img src="../assets/images/Inner-Page---9.JPG" alt="">
    </div>

  </section>

  <!-- Closing -->
  <footer class="closing">
    <img src="../assets/logos/Nonna_logomark_Butter.svg" alt="" class="closing-tree">
    <p class="closing-text">estamos apenas voltando ao que realmente importa.<br><strong>frescor e simplicidade.</strong></p>
  </footer>

  <script>
    (function () {
      const header   = document.querySelector('header');
      const heroLogo = document.querySelector('.hero-logo');
      const manifest = document.querySelector('.manifest-top');
      const closing  = document.querySelector('.closing');

      var swapped = false;

      function onScroll() {
        var headerH  = header.offsetHeight;
        var logoRect = heroLogo.getBoundingClientRect();

        // Trigger swap the moment the bottom of the hero logo reaches the header bottom
        var shouldSwap = logoRect.bottom <= headerH;

        if (shouldSwap && !swapped) {
          swapped = true;
          heroLogo.style.opacity  = '0';
          manifest.style.opacity  = '0';
          header.classList.add('scrolled');
        } else if (!shouldSwap && swapped) {
          swapped = false;
          heroLogo.style.opacity  = '1';
          manifest.style.opacity  = '1';
          header.classList.remove('scrolled');
        }
      }

      window.addEventListener('scroll', onScroll, { passive: true });

      // Footer color switch
      const footerObserver = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            header.classList.add('light');
          } else {
            header.classList.remove('light');
          }
        });
      }, { threshold: 0 });

      footerObserver.observe(closing);
    })();
  </script>

</body>
</html>
